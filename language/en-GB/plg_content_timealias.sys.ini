PLG_CONTENT_TIMEALIAS="Content - Timealias"
PLG_CONTENT_TIMEALIAS_XML_DESCRIPTION="Gives every new article an alias in the YYYYMMDD-HHMMSS format, using the site time zone. If the alias is already taken in the category, appends -2, -3 and so on. By default, an alias typed in manually or supplied on import is kept. Existing articles, categories and menu items are left untouched."
