PLG_CONTENT_TIMEALIAS="Материалы — Timealias"
PLG_CONTENT_TIMEALIAS_XML_DESCRIPTION="Присваивает новому материалу алиас вида ГГГГММДД-ЧЧММСС по часовому поясу сайта. Если такой алиас в категории уже занят, добавляет суффикс -2, -3 и т. д. Алиас, вписанный вручную или пришедший при импорте, по умолчанию сохраняет. Существующие материалы, категории и пункты меню не затрагивает."
PLG_CONTENT_TIMEALIAS_KEEP_ALIAS_LABEL="Сохранять заданный алиас"
PLG_CONTENT_TIMEALIAS_KEEP_ALIAS_DESC="«Да» — метка времени ставится, только если поле алиаса оставлено пустым; алиас, вписанный вручную или пришедший при импорте (через REST API или модель Joomla), сохраняется, и старые адреса статей не ломаются. «Нет» — метку времени получает любой новый материал, что бы ни было в поле алиаса."
