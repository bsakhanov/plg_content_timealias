PLG_CONTENT_TIMEALIAS="Материалы — Timealias"
PLG_CONTENT_TIMEALIAS_XML_DESCRIPTION="Присваивает новому материалу алиас вида ГГГГММДД-ЧЧММСС по часовому поясу сайта. Если такой алиас в категории уже занят, добавляет суффикс -2, -3 и т. д. Алиас, вписанный вручную или пришедший при импорте, по умолчанию сохраняет. Существующие материалы, категории и пункты меню не затрагивает."
